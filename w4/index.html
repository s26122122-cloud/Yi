<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>達文西風格 - 朋友對我的動態留言板</title>
  
  <!-- 引入古典風格 Google 字型 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Noto+Serif+TC:wght@400;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================
       【顏色與變數設定區域】
       可以在此輕鬆修改主題色彩與視覺參數
       ========================================== */
    :root {
      /* 背景色：達文西復古暗色調 / 羊皮紙基底 */
      --bg-color: #1a1612;
      --card-bg: #2a221b;
      --card-border: #8c6d3f;
      
      /* 文字顏色：古典金與柔和羊皮紙文字 */
      --text-main: #e8d8c8;
      --text-title: #d4af37;
      --text-muted: #a6937c;
      
      /* 焦點輪播特效顏色 (金光發光) */
      --highlight-border: #f3e5ab;
      --highlight-glow: rgba(212, 175, 55, 0.6);
      
      /* 動畫與字型設定 */
      --transition-speed: 0.6s;
      --font-title: 'Cinzel', 'Noto Serif TC', serif;
      --font-body: 'Noto Serif TC', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      /* 模擬油畫/羊皮紙質感的漸層背景 */
      background-image: 
        radial-gradient(circle at 50% 30%, rgba(60, 45, 30, 0.5) 0%, rgba(20, 15, 10, 0.9) 100%),
        repeating-linear-gradient(45deg, rgba(0, 0, 0, 0.03) 0px, rgba(0, 0, 0, 0.03) 2px, transparent 2px, transparent 4px);
      color: var(--text-main);
      font-family: var(--font-body);
      min-height: 100vh;
      padding: 40px 20px;
    }

    /* 頁面標題區塊 */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-family: var(--font-title);
      font-size: 2.5rem;
      color: var(--text-title);
      text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8), 0 0 15px rgba(212, 175, 55, 0.3);
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    header p {
      color: var(--text-muted);
      font-style: italic;
      font-size: 1.1rem;
    }

    /* ==========================================
       【讀取中酷炫動畫 (Da Vinci Palette Spinner)】
       ========================================== */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 100px 0;
    }

    .loader-ring {
      width: 70px;
      height: 70px;
      border: 4px solid rgba(140, 109, 63, 0.2);
      border-top: 4px solid var(--text-title);
      border-right: 4px solid var(--highlight-border);
      border-radius: 50%;
      animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
      box-shadow: 0 0 20px rgba(212, 175, 55, 0.2);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .loading-text {
      margin-top: 20px;
      font-size: 1.2rem;
      color: var(--text-title);
      letter-spacing: 3px;
      font-family: var(--font-title);
      animation: pulse 1.5s infinite alternate;
    }

    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    /* ==========================================
       【瀑布流排版 (Masonry Layout)】
       ========================================== */
    .masonry-grid {
      column-count: 3; /* 預設 3 欄 */
      column-gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 響應式調整欄數 */
    @media (max-width: 900px) {
      .masonry-grid { column-count: 2; }
    }
    @media (max-width: 600px) {
      .masonry-grid { column-count: 1; }
    }

    /* ==========================================
       【留言卡片基本與復古框樣式】
       ========================================== */
    .card {
      break-inside: avoid; /* 防止卡片在瀑布流中被跨欄截斷 */
      margin-bottom: 25px;
      background-color: var(--card-bg);
      border: 2px solid var(--card-border);
      border-radius: 4px;
      padding: 25px;
      position: relative;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
      transition: all var(--transition-speed) ease;
      cursor: pointer;
      overflow: hidden;
    }

    /* 畫框內角裝飾 (典雅復古金角) */
    .card::before {
      content: '';
      position: absolute;
      top: 4px; left: 4px; right: 4px; bottom: 4px;
      border: 1px solid rgba(140, 109, 63, 0.4);
      pointer-events: none;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      border-bottom: 1px dashed rgba(140, 109, 63, 0.3);
      padding-bottom: 8px;
    }

    .card-author {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--text-title);
    }

    .card-time {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .card-content {
      font-size: 1rem;
      line-height: 1.7;
      color: var(--text-main);
      white-space: pre-wrap; /* 保持留言中的換行 */
      word-break: break-word;
    }

    /* ==========================================
       【輪播特效狀態 (Highlight & Dim)】
       ========================================== */
    /* 被選中的卡片：放大、亮起、金光外發光 */
    .card.highlight {
      transform: scale(1.06);
      border-color: var(--highlight-border);
      box-shadow: 0 0 25px var(--highlight-glow), 0 15px 30px rgba(0, 0, 0, 0.7);
      filter: blur(0px) brightness(1.15);
      z-index: 10;
    }

    /* 未被選中的卡片：變暗、稍微模糊 */
    .card.dimmed {
      opacity: 0.4;
      filter: blur(1.5px) grayscale(30%);
      transform: scale(0.98);
    }
  </style>
</head>
<body>

  <header>
    <h1>Da Vinci's Gallery</h1>
    <p>—— 朋友對我的動態留言牆 ——</p>
  </header>

  <!-- 讀取中動畫區塊 -->
  <div id="loading">
    <div class="loader-ring"></div>
    <div class="loading-text">讀取留言中...</div>
  </div>

  <!-- 瀑布流卡片容器 -->
  <div id="masonry-wall" class="masonry-grid"></div>

  <script>
    /* ==========================================
       【控制參數設定區】
       ========================================== */
    // Google 試算表發布的網址
    const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSV7GHYk8alibEF3RorWqfYRiwPdzcguG1nXVDsJUEyTYrN6a7gY19otoUvSj0WAAsw_WtZjZVCoLLe/pubhtml';
    
    // 💡 輪播切換秒數設定 (單位：毫秒，例如 3000 = 3 秒)
    const ROTATE_INTERVAL_MS = 3000;

    // 全局變數
    let cardsData = [];
    let currentIndex = 0;
    let rotateTimer = null;

    /* ==========================================
       【1. CSV 解析器 (處理引號與逗號)】
       ========================================== */
    function parseCSV(text) {
      const lines = [];
      let row = [];
      let entry = '';
      let insideQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const c = text[i];
        const nextC = text[i + 1];

        if (c === '"') {
          if (insideQuotes && nextC === '"') {
            entry += '"';
            i++; // 跳過轉義的雙引號
          } else {
            insideQuotes = !insideQuotes; // 切換引號狀態
          }
        } else if (c === ',' && !insideQuotes) {
          row.push(entry.trim());
          entry = '';
        } else if ((c === '\r' || c === '\n') && !insideQuotes) {
          if (c === '\r' && nextC === '\n') i++;
          row.push(entry.trim());
          if (row.length > 1 || row[0] !== '') lines.push(row);
          row = [];
          entry = '';
        } else {
          entry += c;
        }
      }
      if (entry || row.length > 0) {
        row.push(entry.trim());
        lines.push(row);
      }
      return lines;
    }

    /* ==========================================
       【2. 將 PubHTML 轉為 CSV 網址並 Fetch 讀取】
       ========================================== */
    async function fetchMessages() {
      try {
        // 將 pubhtml 轉成 export?format=csv 確保能成功取得 CSV 格式
        let csvUrl = SHEET_URL;
        if (csvUrl.endsWith('/pubhtml')) {
          csvUrl = csvUrl.replace(/\/pubhtml\$/, '/pub?output=csv');
        }

        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error('網路回應不成功');
        
        const rawText = await response.text();
        const parsedRows = parseCSV(rawText);

        // 假設第一列是表頭 (時間戳記, 名字, 悄悄話)，從第二列開始取資料
        const dataRows = parsedRows.slice(1);

        cardsData = dataRows.map(row => {
          return {
            timestamp: row[0] || '未知時間',
            name: row[1] || '匿名朋友',
            content: row[2] || '（無留言內容）'
          };
        });

        // 隱藏讀取中動畫，渲染卡片
        document.getElementById('loading').style.display = 'none';
        renderCards(cardsData);

        // 資料渲染完成後啟動輪播特效
        if (cardsData.length > 0) {
          startCarousel();
        }

      } catch (error) {
        console.error('讀取失敗:', error);
        document.getElementById('loading').innerHTML = `
          <div style="color: #e74c3c; font-size: 1.2rem;">
            讀取留言失敗，請確認網址與權限設定。
          </div>
        `;
      }
    }

    /* ==========================================
       【3. 動態渲染留言卡片】
       ========================================== */
    function renderCards(data) {
      const wall = document.getElementById('masonry-wall');
      wall.innerHTML = '';

      data.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card';
        card.dataset.index = index;

        // XSS 簡單防護與 HTML 結構繪製
        card.innerHTML = `
          <div class="card-header">
            <span class="card-author">${escapeHTML(item.name)}</span>
            <span class="card-time">${escapeHTML(item.timestamp)}</span>
          </div>
          <div class="card-content">${escapeHTML(item.content)}</div>
        `;

        // 點擊卡片可手動將該卡片設為當前高亮焦點
        card.addEventListener('click', () => {
          currentIndex = index;
          updateHighlight();
          resetTimer(); // 重置計時器，避免點擊後馬上又被自動輪播換掉
        });

        wall.appendChild(card);
      });
    }

    /* 安全處理字串中的 HTML 標籤 */
    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, 
        tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
      );
    }

    /* ==========================================
       【4. 輪播焦點特效 (Highlight / Dim)】
       ========================================== */
    function updateHighlight() {
      const allCards = document.querySelectorAll('.card');
      if (allCards.length === 0) return;

      allCards.forEach((card, idx) => {
        if (idx === currentIndex) {
          card.classList.add('highlight');
          card.classList.remove('dimmed');
        } else {
          card.classList.remove('highlight');
          card.classList.add('dimmed');
        }
      });
    }

    /* 啟動計時器：每隔指定秒數讓下張卡片亮起 */
    function startCarousel() {
      updateHighlight(); // 立即高亮第一張
      rotateTimer = setInterval(() => {
        currentIndex = (currentIndex + 1) % cardsData.length;
        updateHighlight();
      }, ROTATE_INTERVAL_MS);
    }

    /* 手動點擊卡片時重置計時器 */
    function resetTimer() {
      if (rotateTimer) {
        clearInterval(rotateTimer);
        startCarousel();
      }
    }

    // 頁面載入後執行
    window.addEventListener('DOMContentLoaded', fetchMessages);
  </script>
</body>
</html>
