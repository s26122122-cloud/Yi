<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁程式設計作品集 | 神社鳥居風入口網站</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Zen Old Mincho & Noto Serif TC for authentic Japanese calligraphy typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Shippori+Mincho:wght@500;700;800&family=Zen+Old+Mincho:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        torii: {
                            red: '#C73E3A',      // 傳統鳥居朱紅
                            vermilion: '#E8524D',// 鮮明朱紅
                            dark: '#8C2522',     // 深暗紅
                        },
                        shrine: {
                            black: '#1A1818',    // 漆黑
                            charcoal: '#2D2A2A', // 墨灰
                            paper: '#FDFBF7',    // 和紙原色
                            gold: '#D4AF37',     // 金箔
                            goldLight: '#F3E5AB',// 淺金
                            wood: '#8B5A2B',     // 繪馬木色
                        }
                    },
                    fontFamily: {
                        mincho: ['"Shippori Mincho"', '"Zen Old Mincho"', '"Noto Serif TC"', 'serif'],
                    },
                    animation: {
                        'pulse-gold': 'pulseGold 3s infinite',
                        'shake': 'shake 0.4s ease-in-out',
                        'petal-fall': 'fall 10s linear infinite',
                        'float-soft': 'floatSoft 4s ease-in-out infinite',
                    },
                    keyframes: {
                        pulseGold: {
                            '0%, 100%': { boxShadow: '0 0 15px rgba(212, 175, 55, 0.4)', borderColor: '#D4AF37' },
                            '50%': { boxShadow: '0 0 25px rgba(232, 82, 77, 0.7)', borderColor: '#E8524D' },
                        },
                        shake: {
                            '0%, 100%': { transform: 'translateX(0)' },
                            '20%, 60%': { transform: 'translateX(-6px) rotate(-1deg)' },
                            '40%, 80%': { transform: 'translateX(6px) rotate(1deg)' },
                        },
                        fall: {
                            '0%': { transform: 'translateY(-10vh) rotate(0deg)', opacity: '0.8' },
                            '100%': { transform: 'translateY(105vh) rotate(360deg)', opacity: '0.1' },
                        },
                        floatSoft: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-6px)' },
                        }
                    }
                }
            }
        }
    </script>

            transform: translateX(-100%);
        }
        .gold-shimmer:hover::after {
            transform: translateX(100%);
        }
